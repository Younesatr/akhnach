<!DOCTYPE html>
<html lang="en">
<head>

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #FFB703;
            --secondary-color: #0057B8;
            --dark-gray: #2B2D42;
            --light-gray: #8D99AE;
            --bg-white: #FFFFFF;
        }
    }

    @layer base {
        body {
            @apply font-sans text-[var(--dark-gray)] bg-[var(--bg-white)];
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-bold;
        }
    }

    @layer components {
        .btn-primary {
            @apply px-6 py-3 bg-[var(--primary-color)] text-[var(--dark-gray)] rounded-lg font-semibold transition-all duration-300 hover:shadow-lg;
        }
        .btn-secondary {
            @apply px-6 py-3 bg-[var(--secondary-color)] text-white rounded-lg font-semibold transition-all duration-300 hover:shadow-lg;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/Header.js"></script>
